{% if jekyll.environment == 'production' %}
{% if site.analytics.counter %}
<script async src="https://cdn.counter.dev/script.js" data-id="{{ site.analytics.counter | escape }}" data-utcoffset="8"></script>
{% endif %}
{% if site.analytics.google %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ site.analytics.google | jsonify }});
</script>
{% endif %}
{% endif %}
